name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --windowed --name PCCepAsistani main.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PCCepAsistani-Windows
          path: dist/PCCepAsistani.exe
          if-no-files-found: error
